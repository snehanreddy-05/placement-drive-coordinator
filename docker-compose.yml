version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: placementos-postgres
    restart: always
    environment:
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: placement_password_2026
      POSTGRES_DB: placementos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_user -d placementos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementos-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://placement_user:placement_password_2026@db:5432/placementos_db
      ENVIRONMENT: production
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LLM_PROVIDER: deterministic
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placementos-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
